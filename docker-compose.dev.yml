version: "3.8"

services:
  kaskad:
    build: .
    container_name: kaskad-bot
    restart: always
    environment:
      - SALON_ID=kaskad
      - TZ=Europe/Moscow
      - DB_PATH=/app/data/bot_cache.db
    ports:
      - "8000:8000"
    volumes:
      - ./salons/kaskad/data:/app/data
      - ./salons/kaskad/.env:/app/.env:ro
      - ./salons/kaskad/static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

